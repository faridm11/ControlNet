name: controlnet
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.12.12
  
  # PyTorch with CUDA 12.4
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - pytorch-cuda=12.4
  
  # Core conda packages
  - pandas=2.3.3
  - scipy=1.16.3
  - pyyaml=6.0.3
  - requests=2.32.5
  - safetensors=0.7.0
  - accelerate=1.12.0
  - huggingface_hub=1.4.1
  - tokenizers=0.23.0
  - transformers=4.54.1
  - tqdm=4.67.1
  - pygments=2.19.2
  
  # System libraries
  - nomkl=1.0
  - libopenblas=0.3.30
  - openssl=3.6.1
  - ca-certificates
  - certifi
  
  # Build tools
  - pip=25.3
  - setuptools=80.9.0
  - wheel=0.46.0
  
  # Pip packages
  - pip:
    # Hugging Face
    - diffusers==0.35.2
    - peft==0.18.0
    
    # Training optimizations
    - xformers==0.0.30.post2
    - bitsandbytes==0.48.2
    - einops==0.8.1
    
    # Computer vision
    - opencv-python==4.12.0.88
    - pillow==11.3.0
    - imageio==2.37.2
    - scikit-image==0.26.0
    - matplotlib==3.10.7
    
    # Data processing
    - numpy==2.2.6
    - datasets==4.4.1
    - sentencepiece==0.3.2
    
    # Experiment tracking
    - wandb==0.19.5
    - tensorboard==2.19.3
    - torchmetrics==1.6.2
    - torch-fidelity==0.4.0   # required by torchmetrics FID/KID

    # Jupyter (optional)
    - jupyterlab==4.5.0
    - ipykernel==7.1.0
    - ipython==9.8.0
    
    # Utilities
    - rich==14.1.0
    - click==8.3.1
    - protobuf==6.33.1
